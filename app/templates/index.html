{% extends "base.html" %}

{% block content %}

<div class="min-h-screen">

    <div class="max-w-7xl mx-auto px-6 py-10">

        <header class="mb-10">

            <h1 class="text-5xl font-bold text-slate-900">
                🌐 Website Summarizer
            </h1>

            <p class="mt-3 text-lg text-slate-600">
                AI-powered website analysis using GPT-5 Nano
            </p>

        </header>

        <div class="grid lg:grid-cols-3 gap-8">

            <!-- Left Panel -->

            <aside>

                <div class="sticky top-8">

                    <div class="bg-white rounded-2xl shadow border p-6">

                        <h2 class="text-xl font-semibold mb-4">
                            Analyse Website
                        </h2>

                        <form

                            hx-post="/summarize"

                            hx-target="#summary"

                            hx-swap="innerHTML"

                        >

                            <label class="block text-sm font-medium mb-2">

                                Website URL

                            </label>

                            <input

                                type="url"

                                name="url"

                                required

                                placeholder="https://example.com"

                                class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"

                            >

                            <button

                                class="w-full mt-5 rounded-lg bg-blue-600 px-4 py-3 text-white font-semibold hover:bg-blue-700"

                            >

                                Analyse Website

                            </button>

                            <div class="htmx-indicator mt-5">

                                <svg class="animate-spin h-5 w-5 mr-3"
                                     xmlns="http://www.w3.org/2000/svg"
                                     fill="none"
                                     viewBox="0 0 24 24">

                                    <circle
                                        class="opacity-25"
                                        cx="12"
                                        cy="12"
                                        r="10"
                                        stroke="currentColor"
                                        stroke-width="4"
                                    />

                                    <path
                                        class="opacity-75"
                                        fill="currentColor"
                                        d="M4 12a8 8 0 018-8v8z"
                                    />

                                </svg>

                                <span>

                                    Analysing website...

                                </span>

                            </div>

                        </form>

                    </div>

                </div>

            </aside>

            <!-- Right Panel -->

            <main class="lg:col-span-2">

                <div id="summary">

                    <div class="bg-white rounded-2xl border shadow p-12">

                        <div class="text-center text-slate-500">

                            <svg
                                class="mx-auto h-14 w-14 mb-4"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24">

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M9 12h6m-6 4h6M8 6h8"
                                />

                            </svg>

                            <h3 class="text-xl font-semibold">

                                No analysis yet

                            </h3>

                            <p class="mt-2">

                                Enter a website URL and click
                                <strong>Analyse Website</strong>.

                            </p>

                        </div>

                    </div>

                </div>

            </main>

        </div>

    </div>

</div>

{% endblock %}
