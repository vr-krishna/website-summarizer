[project]
name = "website-summarizer"
version = "0.1.0"
description = "An AI-powered website summarizer built with FastAPI, HTMX, Jinja2, BeautifulSoup, and the OpenAI API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.140.7",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.2",
    "openai>=2.49.0",
    "pydantic-settings>=2.14.2",
    "pymdown-extensions>=11.0.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
